name: HAMO DARK Portfolio CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find Portfolio ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "hamo-dark-interactive-portfolio.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ERROR: hamo-dark-interactive-portfolio.zip was not found!"
            echo ""
            echo "Files found:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "✅ ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Portfolio
        shell: bash
        run: |
          set -e

          rm -rf hamo-dark-project
          mkdir -p hamo-dark-project

          unzip -o "$ZIP_FILE" -d hamo-dark-project

          echo "✅ Portfolio extracted."

          find hamo-dark-project -maxdepth 4 -type f | head -150

      - name: Locate package.json
        id: project
        shell: bash
        run: |
          set -e

          PACKAGE_FILE=$(find hamo-dark-project \
            -type f \
            -name "package.json" \
            | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "❌ ERROR: package.json was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "✅ package.json:"
          echo "$PACKAGE_FILE"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Show package.json
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "===== package.json ====="
          cat package.json
          echo "========================"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Installing dependencies..."

          npm install \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

          echo "✅ Dependencies installed."

      - name: Build Portfolio
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Building portfolio..."

          npm run build

          echo "✅ Build completed."

      - name: Find build output
        id: output
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ -d "dist" ]; then
            echo "output_dir=dist" >> "$GITHUB_OUTPUT"
            echo "✅ Found dist/"

          elif [ -d "build" ]; then
            echo "output_dir=build" >> "$GITHUB_OUTPUT"
            echo "✅ Found build/"

          elif [ -d "out" ]; then
            echo "output_dir=out" >> "$GITHUB_OUTPUT"
            echo "✅ Found out/"

          else
            echo "❌ ERROR: No build output found."
            exit 1
          fi

      - name: Verify build
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          OUTPUT="${{ steps.output.outputs.output_dir }}"

          if [ ! -d "$OUTPUT" ]; then
            echo "❌ Build directory does not exist."
            exit 1
          fi

          if [ -z "$(find "$OUTPUT" -type f -print -quit)" ]; then
            echo "❌ Build directory is empty."
            exit 1
          fi

          echo "✅ Build verified."

          echo ""
          echo "Build files:"
          find "$OUTPUT" -maxdepth 3 -type f | head -100

      - name: Prepare GitHub Pages
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          OUTPUT="${{ steps.output.outputs.output_dir }}"

          if [ -f "$OUTPUT/index.html" ]; then
            cp "$OUTPUT/index.html" "$OUTPUT/404.html"
            echo "✅ SPA fallback created."
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.output.outputs.output_dir }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
