name: HAMO DARK Portfolio CI/CD

on:
push:
branches: ["main"]
pull_request:
branches: ["main"]
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: "pages"
cancel-in-progress: false

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Find Portfolio ZIP
    shell: bash
    run: |
      ZIP_FILE=$(find . -maxdepth 2 -type f -iname "hamo-dark-interactive-portfolio.zip" | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: hamo-dark-interactive-portfolio.zip was not found!"
        exit 1
      fi

      echo "Found ZIP: $ZIP_FILE"
      echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

  - name: Extract Portfolio
    shell: bash
    run: |
      mkdir -p hamo-dark-project
      unzip -o "$ZIP_FILE" -d hamo-dark-project

      echo "Extracted files:"
      find hamo-dark-project -maxdepth 3 -type f | head -100

  - name: Locate package.json
    id: project
    shell: bash
    run: |
      PACKAGE_FILE=$(find hamo-dark-project -type f -name "package.json" | head -n 1)

      if [ -z "$PACKAGE_FILE" ]; then
        echo "ERROR: package.json was not found inside hamo-dark-interactive-portfolio.zip"
        echo "The ZIP does not appear to contain a Node/Vite project."
        exit 1
      fi

      PROJECT_DIR=$(dirname "$PACKAGE_FILE")

      echo "package.json found at: $PACKAGE_FILE"
      echo "Project directory: $PROJECT_DIR"

      echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

  - name: Install dependencies
    working-directory: ${{ steps.project.outputs.project_dir }}
    run: npm install

  - name: Build Portfolio
    working-directory: ${{ steps.project.outputs.project_dir }}
    run: npm run build

  - name: Verify build
    working-directory: ${{ steps.project.outputs.project_dir }}
    shell: bash
    run: |
      if [ ! -d "dist" ]; then
        echo "ERROR: dist folder was not created!"
        exit 1
      fi

      echo "Build successful!"
      echo "Build files:"
      find dist -maxdepth 2 -type f | head -50

  - name: Upload GitHub Pages artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: ${{ steps.project.outputs.project_dir }}/dist

deploy:
if: github.ref == 'refs/heads/main'
needs: build
runs-on: ubuntu-latest

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

steps:
  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4
